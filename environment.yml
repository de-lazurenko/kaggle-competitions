name: kaggle-playground
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  
  # Core data
  - numpy
  - pandas
  - scipy
  
  # Machine learning
  - scikit-learn
  - imbalanced-learn        # SMOTE и работа с дисбалансом классов
  
  # Visualization
  - matplotlib
  - seaborn
  - plotly                  # интерактивные графики
  
  # Jupyter
  - jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets              # виджеты в ноутбуках
  
  # Utilities
  - tqdm                    # прогресс-бары
  - joblib                  # параллельные вычисления
  - pyyaml                  # работа с yaml файлами
  
  - pip
  - pip:
      # Gradient boosting — основные фреймворки
      - lightgbm
      - xgboost
      - catboost
      
      # Hyperparameter tuning
      - optuna
      
      # Feature engineering
      - category-encoders    # target encoding, WoE и другие методы
      
      # Kaggle API
      - kaggle
