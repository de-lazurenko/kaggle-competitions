name: kaggle-playground
# Versions pinned on 2026-10-10. Core ML packages (numpy, pandas, scikit-learn, torch, pytabkit,
# lightgbm, xgboost, catboost) match the Mac environment, so results are comparable across machines.
#
# Create:  conda env create -f environment.yml
# GPU (Windows / Linux, NVIDIA): pip installs the CPU build of torch; replace it with the CUDA build:
#   python -m pip install --force-reinstall --no-deps torch==2.14.1 --index-url https://download.pytorch.org/whl/cu126
channels:
  - conda-forge
  - nodefaults   # every package is on conda-forge; "defaults" needs the Anaconda ToS to be accepted
dependencies:
  - python=3.12

  # Core data
  - numpy=2.3.5
  - pandas=2.3.3
  - scipy=1.16.3
  - statsmodels=0.15.0
  - pyarrow=25.0.0

  # Machine learning
  - scikit-learn=1.9.1
  - imbalanced-learn=0.14.2

  # Visualization
  - matplotlib=3.10.0
  - seaborn=0.13.2
  - plotly=7.1.0

  # Jupyter
  - jupyter
  - jupyterlab=4.6.4
  - ipykernel=7.4.0
  - ipywidgets=8.1.9
  - nbformat=5.11.1
  - nbconvert=7.17.1

  # Utilities
  - tqdm=4.70.1
  - joblib=1.6.0
  - pyyaml=6.0.3

  - pip
  - pip:
      # Gradient boosting
      - lightgbm==4.7.0
      - xgboost==3.4.1
      - catboost==1.2.10

      # Neural networks (see the GPU note at the top for the CUDA build of torch)
      - torch==2.14.1
      - pytabkit==1.7.3
      # TabPFN-3.5 weights need a one-time licence acceptance (Prior Labs account). On Windows the browser flow
      # crashes; save the API key instead: python -c "from tabpfn.browser_auth import save_token; save_token(input('API key: '))"
      - tabpfn==9.1.0

      # Hyperparameter tuning
      - optuna==5.0.0

      # Feature engineering
      - category-encoders==2.11.1
      - tiktoken==0.14.0

      # EDA & interpretation
      - ydata-profiling==4.18.4
      - missingno==0.5.2
      - phik==0.12.5
      - shap==0.53.0
      # ydata-profiling imports pkg_resources (gone in newer setuptools); torch 2.14 needs >=77
      - "setuptools>=77,<81"

      # Kaggle API
      - kaggle==2.2.4
