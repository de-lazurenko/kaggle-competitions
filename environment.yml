name: kaggle-playground
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12

  # Core data
  - numpy
  - pandas
  - scipy
  - statsmodels
  - pyarrow

  # Machine learning
  - scikit-learn
  - imbalanced-learn

  # Visualization
  - matplotlib
  - seaborn
  - plotly

  # Jupyter
  - jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets
  - nbformat
  - nbconvert

  # Utilities
  - tqdm
  - joblib
  - pyyaml

  - pip
  - pip:
      # Gradient boosting
      - lightgbm
      - xgboost
      - catboost

      # Neural networks
      - torch
      - pytabkit

      # Hyperparameter tuning
      - optuna

      # Feature engineering
      - category-encoders
      - tiktoken

      # EDA & interpretation
      - ydata-profiling
      - missingno
      - phik
      - shap
      - "setuptools<70"

      # Kaggle API
      - kaggle
