name: kaggle-playground
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  
  # Core data
  - numpy
  - pandas
  - scipy
  
  # Machine learning
  - scikit-learn
  - imbalanced-learn
  
  # Visualization
  - matplotlib
  - seaborn
  - plotly
  
  # Jupyter
  - jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets
  
  # Utilities
  - tqdm
  - joblib
  - pyyaml
  
  - pip
  - pip:
      # Gradient boosting
      - lightgbm
      - xgboost
      - catboost
      
      # Hyperparameter tuning
      - optuna
      
      # Feature engineering
      - category-encoders
      
      # Kaggle API
      - kaggle

      # EDA & interpretation
      - shap
      - ydata-profiling
      - missingno
      - phik
